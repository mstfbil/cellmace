palettes:
  - name: global_palette
    images: automatic

converts:
  - name: tileset_0
    palette: global_palette
    tilesets:
      tile-width: 16
      tile-height: 16
      images:
        - tileset_0.png
  - name: background
    palette: global_palette
    images:
      - background.png
  - name: gamestate_icons
    palette: global_palette
    tilesets:
      tile-width: 16
      tile-height: 16
      images:
        - gamestate_icons.png
  - name: logo
    palette: global_palette
    images:
      - logo.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - tileset_0
      - background
      - gamestate_icons
      - logo