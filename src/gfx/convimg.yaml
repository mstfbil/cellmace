palettes:
    - name: global_palette
      images: automatic

converts:
    - name: cells
      palette: global_palette
      tilesets:
          tile-width: 16
          tile-height: 16
          images:
              - cells.png

outputs:
    - type: c
      include-file: gfx.h
      palettes:
          - global_palette
      converts:
          - cells
