palettes:
    - name: global_palette
      fixed-entries:
          - color: { index: 0, r: 0, g: 0, b: 0 }
            color: { index: 1, r: 255, g: 255, b: 255 }
      images: automatic
converts:
    - name: cells_0
      palette: global_palette
      tilesets:
          tile-width: 16
          tile-height: 16
          images:
              - cells_0.png
outputs:
    - type: c
      include-file: gfx.h
      palettes:
          - global_palette
      converts:
          - cells_0